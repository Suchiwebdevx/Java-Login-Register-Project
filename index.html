<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Home page</title>
<style>

body { 
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 1000px;
    width: 100%;
}
.btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: 0.3s;
    margin: 5px;
    text-decoration: none;
    display: inline-block;
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
.input { width: 100%; padding: 12px 15px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; border-radius: 10px; overflow: hidden; }
th { background: #667eea; color: white; padding: 12px; }
tr:nth-child(even) { background: #f8f9fa; }
tr:hover { background: #e3f2fd; }
td { padding: 10px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
.card { background: rgba(255,255,255,0.95); padding: 30px 20px; border-radius: 15px; text-align: center; transition: 0.3s; cursor: pointer; border: 2px solid transparent; }
.card:hover { transform: translateY(-8px); border-color: #667eea; }
.icon { font-size: 50px; }
</style>
</head>
<body>
<h2>WELCOME TO THE WEBSITE!!</h2>
<a href=register.html><button>Registration</button></a>
<a href=login.html><button>login</button></a>


</body>
</html>
